name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]
  workflow_dispatch:

# A newer run of the same kind replaces an older one; a manual run never cancels a push run.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: Format and shell lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check
      - run: shellcheck install.sh

  test:
    name: Lint and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Per platform, since some code is Unix- or Windows-only.
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  msrv:
    name: Minimum Rust version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Keep in sync with `rust-version` in Cargo.toml and the Rust badge in README.md.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets --locked

  # The installers in this commit, run against the latest published release.
  install:
    name: Installer (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install with install.sh
        if: runner.os != 'Windows'
        env:
          VIPER_INSTALL_DIR: ${{ runner.temp }}/viper-bin
        run: |
          sh install.sh
          "$VIPER_INSTALL_DIR/viper" --version
      # Windows PowerShell 5.1, the oldest shell the one-liner is likely to meet.
      - name: Install with install.ps1
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Get-Content -Raw install.ps1 | Invoke-Expression
          & "$env:LOCALAPPDATA\Programs\viper\viper.exe" --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
